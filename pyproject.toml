[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "covseisnet"
version = "0.2.0"
description = "Covariance matrix analysis of network seismic data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12, <3.14"
authors = [
    { name = "Léonard Seydoux" },
    { name = "Éric Beaucé" },
    { name = "Francis Tong" },
    { name = "Jean Soubestre" },
    { name = "Cyril Journeau" },
    { name = "Nikolai Shapiro" },
]
keywords = ["covariance", "data", "seismic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "obspy",
    "scipy",
    "matplotlib",
    # ObsPy still imports pkg_resources, removed in setuptools 81
    "setuptools<81",
]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = [
    "cartopy",
    "ipython",
    "jupyter>=1.1.1",
    "sphinx",
    "sphinx_book_theme",
    "sphinx_gallery",
    "sphinxcontrib-bibtex",
    "sphinx_new_tab_link",
    "nbsphinx",
    "pandoc",
]

[tool.hatch.build.targets.sdist]
include = ["covseisnet/**", "README.md", "LICENSE", "tests/**"]
exclude = ["docs/**", "data/**", "examples/**"]

[tool.hatch.build.targets.sdist.options]
force-include = ["docs/**", "data/**"]

[tool.pytest.ini_options]
minversion = "8.0"
xfail_strict = true
filterwarnings = ["ignore::DeprecationWarning"]
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.hatch.envs.dev]
dependencies = ["check-manifest"]

[tool.hatch.envs.test]
dependencies = ["coverage"]
